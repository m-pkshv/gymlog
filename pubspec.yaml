name: gymlog
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management (D-17).
  flutter_riverpod: ^3.3.2
  # Navigation (D-17).
  go_router: ^17.3.0
  # Storage (D-2).
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  # Localization (D-17).
  intl: ^0.20.2
  # Charts (D-17).
  fl_chart: ^1.2.0
  # Rest timer notifications (D-11).
  flutter_local_notifications: ^22.1.0
  # Required to schedule notifications via zonedSchedule (already a
  # transitive dependency of flutter_local_notifications; promoted to
  # direct so it can be imported -- Stage 4, owner-approved 2026-07-21).
  timezone: ^0.11.0
  # Non-critical UI flag only (D-18): "has the notification-permission
  # rationale already been shown" (TS 7.3) -- owner-approved 2026-07-21.
  shared_preferences: ^2.5.3
  # CSV export sharing (TS 3).
  share_plus: ^13.2.1
  path_provider: ^2.1.6
  archive: ^4.0.9
  csv: ^8.0.0
  uuid: ^4.6.0
  # Opens the OS notification-settings screen from S-17 (04_UI_UX_SPEC.md,
  # section 5: "Уведомления" -- статус + переход в системные настройки) --
  # owner-approved 2026-07-22.
  permission_handler: ^12.0.3
  # Avatar picker for the user profile screen (Stage 11, 06_DATA_MODEL.md,
  # section 6.15) -- owner-approved 2026-07-29.
  image_picker: ^1.2.1
  # Lets the user pick a backup ZIP file to restore (Stage 11) -- there is
  # no other way to browse-and-select an arbitrary file on-device.
  # Owner-approved 2026-07-30. Pinned to the 12.x beta line: every stable
  # release up to 11.0.2 depends on an older `win32` that conflicts with
  # `share_plus`'s; 12.x is the first line that resolves alongside it.
  file_picker: ^12.0.0-beta.1
  # Single-workout PDF export (Stage 11) -- owner-approved 2026-07-30.
  # `assets/fonts/Roboto-*.ttf` (Apache License 2.0, Google) is embedded so
  # Cyrillic workout/exercise names and comments render correctly -- the
  # `pdf` package's built-in core fonts (Helvetica/Times/Courier) have no
  # Cyrillic glyphs at all.
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  # Launcher icon + splash-screen generation (Stage 12, owner-approved
  # 2026-07-31) -- dev-only, run manually via `dart run
  # flutter_launcher_icons`/`dart run flutter_native_splash:create`; neither
  # ships in the built app.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    - assets/seed/
    - assets/fonts/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icon (Stage 12, owner-supplied artwork 2026-07-31): dumbbell +
# checkmark mark on a solid blue background. `image_path` is the flat
# original (used for iOS, which wants a single opaque square, no
# transparency). Android uses the separate adaptive foreground/background
# pair below instead of `image_path` -- `adaptive_icon_foreground` was
# extracted from the same artwork by keying out the blue background to
# transparency, then scaled to ~75% and re-centered (the original symbol
# spans ~87% of the canvas width, which a circular adaptive-icon mask on
# some launchers would clip; verified safe against both a worst-case full
# circle and a typical rounded-square mask before finalizing). minSdk is
# already 26 (Android 8+, D-10) -- the same version adaptive icons require
# -- so there's no older-Android legacy-icon fallback to worry about.
# `adaptive_icon_background` is the artwork's own blue (#076DFE), sampled
# directly from the flat background, not the app's in-UI Material blue
# (#4C7BD9) -- owner confirmed keeping the more saturated artwork color
# for the icon rather than matching the muted in-app seed color.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#076DFE"
  adaptive_icon_foreground: "assets/icon/icon_foreground_padded.png"

# Splash screen (Stage 12, owner-approved 2026-07-31): reuses the launcher
# icon artwork itself -- a separate splash graphic wasn't requested. Uses
# the transparent-background symbol layer (not the flat `icon.png`, which
# has its own baked-in blue with a subtle vignette) so the symbol sits on
# a perfectly flat `color` backdrop with no visible seam/rectangle where
# the source image's own background would otherwise meet the splash
# background.
flutter_native_splash:
  color: "#076DFE"
  image: "assets/icon/icon_foreground_padded.png"
  android_12:
    color: "#076DFE"
    image: "assets/icon/icon_foreground_padded.png"
